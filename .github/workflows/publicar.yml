# Desde el cambio a hugojara.cl, la app la publica Netlify (ver netlify.toml).
# GitHub Pages (hugo-jara.github.io/Jara-App) queda solo como puente: manda a
# la misma pantalla en hugojara.cl con la sesión abierta (ver puente/LEEME.md).
name: Publicar puente a hugojara.cl

on:
  push:
    branches: [main]
    paths: ['puente/**', '.github/workflows/publicar.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: puente
      - id: deployment
        uses: actions/deploy-pages@v5
