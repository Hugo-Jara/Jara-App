# Jara App en hugojara.cl (Netlify). Cada cambio en main corre las pruebas y,
# si pasan, publica. Si una prueba falla, queda publicada la versión anterior.
[build]
  command = "npm run test:db && npm run test:pedidos && npm run test:fotos-drive && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Con dominio propio la app queda en la raíz (/), no en /Jara-App/.
  VITE_BASE = "/"
  # Datos públicos del proyecto Supabase del club. La clave "publishable"
  # está hecha para ir en el navegador; los datos los protege la base.
  VITE_SUPABASE_URL = "https://pzzkrbnzguqtjrlwgtiy.supabase.co"
  VITE_SUPABASE_KEY = "sb_publishable_Wy5oEjC-SXRUJdNkREM7Qw_b9xRl9zu"

# El service worker y la página principal se revisan siempre, para que una
# versión nueva llegue al tiro a los teléfonos.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Los archivos de /assets llevan su huella en el nombre: nunca cambian.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# www.hugojara.cl lleva a hugojara.cl.
[[redirects]]
  from = "https://www.hugojara.cl/*"
  to = "https://hugojara.cl/:splat"
  status = 301
  force = true
