# Respaldo: hugojara.cl lo publica Cloudflare Pages desde noviembre 2026
# (comando `npm run publicar`, carpeta `dist`, ver scripts/publicar.mjs).
# Este archivo queda por si hay que volver a Netlify. Los encabezados están en
# public/_headers, que Netlify también lee.
[build]
  command = "npm run publicar"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# www.hugojara.cl lleva a hugojara.cl.
[[redirects]]
  from = "https://www.hugojara.cl/*"
  to = "https://hugojara.cl/:splat"
  status = 301
  force = true

# La política de privacidad es una página aparte, pública (link viejo: /privacidad.html).
[[redirects]]
  from = "/privacidad"
  to = "/privacidad.html"
  status = 200

# Cualquier otra pantalla (por ejemplo /partidos) abre la app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
